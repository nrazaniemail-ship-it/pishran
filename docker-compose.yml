services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pishran
      POSTGRES_USER: pishran
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - pishran_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pishran -d pishran"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pishran_pgdata:
