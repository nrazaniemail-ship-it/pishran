services:
  - type: web
    name: pishran-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: https://nrazaniemail-ship-it.github.io
      - key: DATABASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
