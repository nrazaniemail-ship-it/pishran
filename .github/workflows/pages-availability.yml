name: GitHub Pages availability check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Pishran PWA to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-availability
  cancel-in-progress: true

jobs:
  check-live-site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check published homepage and built assets
        shell: bash
        run: |
          set -euo pipefail
          site="https://nrazaniemail-ship-it.github.io/pishran/"
          echo "Checking $site"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 \
            "$site" --output /tmp/pishran-index.html
          grep -Fq '<title>پیشران | امکان‌سنجی هوشمند</title>' /tmp/pishran-index.html
          grep -Fq 'id="root"' /tmp/pishran-index.html

          mapfile -t assets < <(
            grep -oE '(src|href)="/pishran/assets/[^"]+"' /tmp/pishran-index.html \
              | cut -d '"' -f 2 | sort -u
          )
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::No versioned JavaScript or CSS assets were found in the published homepage."
            exit 1
          fi

          for asset in "${assets[@]}"; do
            echo "Checking asset: $asset"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
              "https://nrazaniemail-ship-it.github.io${asset}" --output /dev/null
          done
          echo "GitHub Pages homepage and ${#assets[@]} built asset(s) are responding successfully."
