name: Deploy isolated web preview

on:
  push:
    branches:
      - feature/integrated-dri-steelmaking-comfar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-src
      - name: Checkout preview source
        uses: actions/checkout@v4
        with:
          ref: feature/integrated-dri-steelmaking-comfar
          path: preview-src
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build unchanged production site
        working-directory: production-src/frontend
        run: |
          npm install
          npm run test:financial
          npm run build
      - name: Build feature preview
        working-directory: preview-src/frontend
        env:
          VITE_PREVIEW_BUILD: 'true'
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm install
          npm run test:financial
          npm run build
      - name: Assemble production root and isolated preview
        run: |
          mkdir -p site/preview
          cp -a production-src/frontend/dist/. site/
          cp -a preview-src/frontend/dist/. site/preview/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview alongside unchanged production root
        id: deployment
        uses: actions/deploy-pages@v4

# Trigger preview workflow on the current feature branch.
