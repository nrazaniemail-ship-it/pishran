name: Deploy Pishran PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pishran-pwa-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Validate Excel financial benchmark
        working-directory: frontend
        run: npm run test:financial
      - name: Validate module exports and navigation
        working-directory: frontend
        run: npm run test:modules
      - name: Independent AHP and BWM ranking method tests
        working-directory: frontend
        run: npm run test:ranking
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  wait-for-branch-pages-build:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the exact-SHA automatic Pages build or a completed ancestor Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 90); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100")
            status=$(echo "$runs" | jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.name == "pages build and deployment" and .head_sha == $sha) | .status' | head -n 1)
            conclusion=$(echo "$runs" | jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.name == "pages build and deployment" and .head_sha == $sha) | .conclusion' | head -n 1)
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || { echo "Automatic Pages build concluded: $conclusion"; exit 1; }
              echo "Automatic Pages deployment completed for exact SHA $TARGET_SHA"
              exit 0
            fi

            # GitHub Pages' automatic branch workflow may skip a rapid follow-up
            # push. After allowing it time to start, accept only a successful
            # Pages deployment for an ancestor of this exact target SHA. The
            # Actions-based deploy below still publishes the artifact built
            # from TARGET_SHA, and no older Pages deployment remains in flight.
            if [ "$attempt" -ge 6 ]; then
              latest_pages_sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .head_branch == "main" and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last | .head_sha // empty')
              if [ -n "$latest_pages_sha" ]; then
                relation=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${latest_pages_sha}...${TARGET_SHA}" --jq '.status')
                if [ "$relation" = "ahead" ] || [ "$relation" = "identical" ]; then
                  echo "Latest automatic Pages deployment $latest_pages_sha is a successful ancestor of exact target $TARGET_SHA; proceeding with exact-SHA Actions artifact"
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for an exact-SHA or successful ancestor automatic Pages deployment: $TARGET_SHA"
          exit 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, wait-for-branch-pages-build]
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public PWA URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 10 --retry-all-errors "$PAGE_URL" -o /tmp/pishran-index.html
          grep -q '<div id="root"></div>' /tmp/pishran-index.html
          curl --fail --silent --show-error --location "${PAGE_URL%/}/manifest.webmanifest" -o /tmp/pishran-manifest.json
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('/tmp/pishran-manifest.json','utf8')); if(m.start_url!=='/pishran/'||m.scope!=='/pishran/') process.exit(1)"
