name: Deploy Pishran PWA to GitHub Pages

on:
  push:
    branches: [main, feature/pishran-module-exports-nav]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Validate Excel financial benchmark
        working-directory: frontend
        run: npm run test:financial
      - name: Validate module exports and navigation
        working-directory: frontend
        run: npm run test:modules
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public PWA URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 10 --retry-all-errors "$PAGE_URL" -o /tmp/pishran-index.html
          grep -q '<div id="root"></div>' /tmp/pishran-index.html
          curl --fail --silent --show-error --location "${PAGE_URL%/}/manifest.webmanifest" -o /tmp/pishran-manifest.json
          node -e "const m=require('/tmp/pishran-manifest.json'); if(m.start_url!=='/pishran/'||m.scope!=='/pishran/') process.exit(1)"
