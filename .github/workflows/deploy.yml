name: Deploy Pishran PWA and PR preview to GitHub Pages

on:
  push:
    branches: [main, feat/foreign-currency-loan-finance-orchestration-v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Validate Excel financial benchmark
        working-directory: frontend
        run: npm run test:financial
      - name: Build production PWA
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build
      - name: Build isolated PR preview
        if: github.ref != 'refs/heads/main'
        working-directory: frontend
        env:
          VITE_PREVIEW_BUILD: 'true'
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build -- --outDir dist-preview
      - name: Assemble preview under /preview/
        if: github.ref != 'refs/heads/main'
        working-directory: frontend
        run: |
          mkdir -p dist/preview
          cp -R dist-preview/. dist/preview/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
