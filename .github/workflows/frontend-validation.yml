name: Frontend build and financial validation

# Validate web changes on main and feature branches. Mobile packaging remains manual-only.

on:
  push:
    branches: [main, feature/raw-template-comfar-financial-integration, feature/integrated-dri-steelmaking-comfar, feat/valuation-date-discounting-rebased, feat/periodic-loan-rate-resets-and-fees, feature/mod05-water-gas-bill-analysis, feature/pishran-module-exports-nav, feature/pishran-module-launcher-redesign, feature/pishran-mod05-energy-dashboard, feature/mod05-bill-gallery-picker]
    paths:
      - 'frontend/**'
      - 'docs/**'
      - '.github/workflows/frontend-validation.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/public-ranking-browser.yml'
  pull_request:
    branches: [main, feature/pishran-module-launcher-redesign, feature/pishran-mod05-energy-dashboard, feature/mod05-bill-upload-source-menu]
    paths:
      - 'frontend/**'
      - 'docs/**'
      - '.github/workflows/frontend-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Local-first storage, project and backup regression tests
        run: npm run test:foundation
      - name: TypeScript and production build
        run: npm run build
      - name: Install Chromium for native IndexedDB browser test
        run: npx playwright install --with-deps chromium
      - name: Build relative-base preview for browser smoke test
        env:
          VITE_PREVIEW_BUILD: 'true'
        run: npm run build
      - name: Native browser IndexedDB regression test
        run: npm run test:indexeddb:browser
      - name: Public ranking persistence regression against built preview
        env:
          PISHRA_RANKING_BASE_URL: http://127.0.0.1:4178/
        run: |
          npm run preview -- --host 127.0.0.1 --port 4178 > /tmp/pishran-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$PISHRA_RANKING_BASE_URL" >/dev/null; then
              node scripts/validate-public-ranking-browser.mjs
              exit $?
            fi
            sleep 1
          done
          cat /tmp/pishran-preview.log
          exit 1
      - name: Financial model regression tests
        run: npm run test:financial
      - name: Executive dashboard MOD-01 integration tests
        run: npm run test:modules
      - name: Independent AHP and BWM ranking method tests
        run: npm run test:ranking
