name: Frontend build and financial validation

# Validate feature branch changes before they are promoted to main.

on:
  push:
    branches: [feature/raw-template-comfar-financial-integration, feature/integrated-dri-steelmaking-comfar, feat/valuation-date-discounting-rebased, feat/periodic-loan-rate-resets-and-fees, feature/mod05-water-gas-bill-analysis, feature/pishran-module-exports-nav, feature/pishran-module-launcher-redesign, feature/pishran-mod05-energy-dashboard, feature/pwa-apk-capability-parity-e2e]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'
  pull_request:
    branches: [main, feature/pishran-module-launcher-redesign]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Local-first storage, project and backup regression tests
        run: npm run test:foundation
      - name: TypeScript and production build
        run: npm run build
      - name: Install Chromium for native IndexedDB browser test
        run: npx playwright install --with-deps chromium
      - name: Build relative-base preview for browser smoke test
        env:
          VITE_PREVIEW_BUILD: 'true'
        run: npm run build
      - name: Native browser IndexedDB regression test
        run: npm run test:indexeddb:browser
      - name: APK and PWA capability parity browser test (built preview)
        run: npm run test:pwa-parity
      - name: Published PWA capability parity browser test
        env:
          PISH_PWA_URL: https://nrazaniemail-ship-it.github.io/pishran/
        run: npm run test:pwa-parity
      - name: Financial model regression tests
        run: npm run test:financial
      - name: Executive dashboard MOD-01 integration tests
        run: npm run test:modules
