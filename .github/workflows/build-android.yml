name: Build Pishran Android APK and iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, feature/fs00-cpp-cps-traceability, feature/raw-template-comfar-financial-integration, feature/integrated-dri-steelmaking-comfar, feat/valuation-date-discounting-rebased, feat/periodic-loan-rate-resets-and-fees]
    paths:
      - "frontend/**"
      - ".github/workflows/build-android.yml"
      - ".github/workflows/frontend-validation.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  # Keep distinct commits isolated so a newer PR push cannot cancel an
  # emulator boot or SDK setup that is still running for another SHA.
  group: pishran-mobile-build-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Validate financial model
        run: npm run test:financial

      - name: Build web app for Capacitor
        run: CAPACITOR_BUILD=true npm run build

      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          mkdir -p android/app/src/main/java/com/pishran/app
          cp native/android/PishranBackupPlugin.java android/app/src/main/java/com/pishran/app/PishranBackupPlugin.java
          cp native/android/MainActivity.java android/app/src/main/java/com/pishran/app/MainActivity.java
          npx cap sync android
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${GITHUB_RUN_NUMBER}
          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName .*/versionName '${VERSION_NAME}'/" android/app/build.gradle
          echo "Building Pishran ${VERSION_NAME} (${VERSION_CODE})"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 420
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          # Capture diagnostics before asserting the foreground activity. The
          # former pidof check was brittle on Android 14 emulator images and
          # exited before preserving logcat when it returned no PID.
          script: |
            set -e
            capture_diagnostics() {
              adb shell dumpsys activity activities > "$RUNNER_TEMP/pishran-activity.txt" 2>&1 || true
              adb logcat -d -v time > "$RUNNER_TEMP/pishran-logcat.txt" 2>&1 || true
            }
            # Preserve diagnostics even when install or launch fails.
            trap capture_diagnostics EXIT
            adb devices -l
            adb shell getprop sys.boot_completed
            adb shell settings put global package_verifier_enable 0
            adb shell settings put global verifier_verify_adb_installs 0
            adb logcat -c
            APK="$GITHUB_WORKSPACE/frontend/android/app/build/outputs/apk/debug/app-debug.apk"
            installed=0
            # Hosted API 34 emulators can transiently time out during package integrity
            # verification. Retry installation and retain the final failure evidence.
            for attempt in 1 2 3; do
              if adb install -r "$APK"; then
                installed=1
                break
              fi
              echo "APK install attempt $attempt failed; retrying after verifier recheck." | tee -a "$RUNNER_TEMP/pishran-launch.txt"
              adb shell settings put global package_verifier_enable 0 || true
              adb shell settings put global verifier_verify_adb_installs 0 || true
              sleep 10
            done
            test "$installed" -eq 1
            # Do not use am start -W: on the x86_64 hosted emulator; it can time out
            # while the Activity is still launched successfully.
            adb shell am start -n com.pishran.app/.MainActivity 2>&1 | tee -a "$RUNNER_TEMP/pishran-launch.txt"
            # Poll foreground state for up to 60 seconds; fail only if MainActivity never resumes.
            resumed=0
            for i in $(seq 1 30); do
              if adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep -F "com.pishran.app/.MainActivity"; then
                resumed=1
                break
              fi
              sleep 2
            done
            sleep 3
            capture_diagnostics
            # Fail if MainActivity never reaches foreground, or the app itself crashes/ANRs.
            test "$resumed" -eq 1
            ! grep -q "FATAL EXCEPTION" "$RUNNER_TEMP/pishran-logcat.txt"
            ! grep -E "ANR in com.pishran.app|am_anr.*com.pishran.app|Input dispatching timed out.*com.pishran.app" "$RUNNER_TEMP/pishran-logcat.txt"
            grep -E "mResumedActivity|topResumedActivity" "$RUNNER_TEMP/pishran-activity.txt" | grep -F "com.pishran.app/.MainActivity"

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pishran-Android-Emulator-Diagnostics
          path: |
            ${{ runner.temp }}/pishran-activity.txt
            ${{ runner.temp }}/pishran-launch.txt
            ${{ runner.temp }}/pishran-logcat.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pishran-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-ipa:
    runs-on: macos-15
    timeout-minutes: 50
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Build web app for Capacitor
        run: CAPACITOR_BUILD=true npm run build

      - name: Generate Capacitor iOS project
        run: |
          npx cap add ios
          npx cap sync ios
          xcodebuild -version

      # This produces a correctly packaged but unsigned IPA. Device installation
      # requires Apple code signing and a matching provisioning profile.
      - name: Archive iOS app (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Pishran.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Pishran.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/App.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/frontend/Pishran-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pishran-iOS-IPA-unsigned
          path: frontend/Pishran-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
