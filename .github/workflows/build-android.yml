name: Build Pishran Android APK and iOS IPA

# Mobile builds are paused. Run manually only when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pishran-mobile-manual-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install
      - name: Validate financial model
        run: npm run test:financial
      - name: Build web app for Capacitor
        run: CAPACITOR_BUILD=true npm run build
      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          mkdir -p android/app/src/main/java/com/pishran/app
          cp native/android/PishranBackupPlugin.java android/app/src/main/java/com/pishran/app/PishranBackupPlugin.java
          cp native/android/MainActivity.java android/app/src/main/java/com/pishran/app/MainActivity.java
          npx cap sync android
          rm -rf android/app/src/main/res/mipmap-*
          cp -R native/android/res/. android/app/src/main/res/
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${GITHUB_RUN_NUMBER}
          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName .*/versionName '${VERSION_NAME}'/" android/app/build.gradle
          echo "Building Pishran ${VERSION_NAME} (${VERSION_CODE})"
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 420
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/frontend/scripts/android-emulator-smoke-test.sh"
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pishran-Android-Emulator-Diagnostics
          path: |
            ${{ runner.temp }}/pishran-activity.txt
            ${{ runner.temp }}/pishran-launch.txt
            ${{ runner.temp }}/pishran-logcat.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pishran-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-ipa:
    runs-on: macos-15
    timeout-minutes: 50
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: Build web app for Capacitor
        run: CAPACITOR_BUILD=true npm run build
      - name: Generate Capacitor iOS project
        run: |
          npx cap add ios
          npx cap sync ios
          xcodebuild -version
      - name: Archive iOS app (unsigned)
        run: |
          xcodebuild \\
            -workspace ios/App/App.xcworkspace \\
            -scheme App \\
            -configuration Release \\
            -sdk iphoneos \\
            -destination 'generic/platform=iOS' \\
            -archivePath "$RUNNER_TEMP/Pishran.xcarchive" \\
            CODE_SIGNING_ALLOWED=NO \\
            archive
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Pishran.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/App.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/frontend/Pishran-unsigned.ipa" Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pishran-iOS-IPA-unsigned
          path: frontend/Pishran-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
