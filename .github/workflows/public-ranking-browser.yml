name: Public PWA ranking interaction verification

on:
  workflow_run:
    workflows: ["Deploy Pishran PWA to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-ranking-browser-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verify-live-ranking:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify live public PWA ranking interaction
        working-directory: frontend
        run: node scripts/validate-public-ranking-browser.mjs
